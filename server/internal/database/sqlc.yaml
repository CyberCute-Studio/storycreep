# sqlc generates the Go code for the queries in queries/ from the schema the
# migrations build. Run "go generate ./internal/database" in server/ after
# changing a query or a migration; CI fails when the generated code is out of
# date.
#
# Only the structs of the tables and enums that a query uses are generated.
# River's tables (migrations 00002 and 00003) belong to the job queue, which
# reads and writes them through River (package jobs), not through queries.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    gen:
      go:
        package: queries
        out: queries
        sql_package: pgx/v5
        omit_unused_structs: true
