name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that newly published advisories fail the dependency audit
  # without waiting for a code change.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running checks. A run on main,
# including the scheduled audit, is never cancelled once it starts. Later runs
# queue behind it, and GitHub keeps only the newest queued run, which tests,
# and publishes, everything the cancelled ones would have.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PRD §9.9: development is first-class on Windows ARM64 and macOS, so
        # the suite runs natively on all three, except the database tests,
        # which need Linux containers and run in the database job.
        os: [ubuntu-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go that deploy/Dockerfile builds the server with, as every job's
      # is, rather than the newest: the rich text's word counts and link
      # rules read Go's Unicode tables, which a newer Go may have of another
      # version (TestUnicodeTables), so the tests check the tables that the
      # server has. TestCIGoVersion fails when the two differ.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: JavaScript tests
        run: pnpm test

      - name: gofmt
        working-directory: server
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      # The database tests need Linux containers, which the Windows and macOS
      # runners cannot run, so -short skips them here and the database job
      # runs them.
      - name: Go tests
        working-directory: server
        run: go test -short ./...

      - name: PRD and plan checks
        run: pnpm docs:check

      # PRD NFR-Q-02: the tests that verify each requirement, and the MVP
      # acceptance criteria that no test verifies. A tag that cannot be read
      # or names an unknown requirement fails the build. A criterion without
      # a test does not, until plan item 119 makes the report a gate.
      - name: Traceability report
        id: traceability
        shell: bash
        run: pnpm traceability | tee -a "$GITHUB_STEP_SUMMARY"

      # The report is written before a tag problem fails the step, so it is
      # published then too.
      - name: Upload the traceability report
        if: matrix.os == 'ubuntu-latest' && (success() || steps.traceability.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability-report
          path: traceability-report/
          if-no-files-found: error

  # PRD NFR-Q-01 and §9.9: the server's tests run against real PostgreSQL, in
  # Docker, on every supported version.
  database:
    name: Database tests (PostgreSQL ${{ matrix.postgres }})
    strategy:
      fail-fast: false
      matrix:
        postgres: [15, 16, 17]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Go tests
        working-directory: server
        env:
          STORYCREEP_TEST_POSTGRES_IMAGE: postgres:${{ matrix.postgres }}-alpine
        run: go test ./...

  # PRD FR-ADMIN-04 AC2: merged migrations are immutable, and every change is
  # tested as an upgrade. Until the first release, the upgrade seeds the
  # database from the migrations of the main branch (plan note N8); item 119
  # switches the seed to the previous release. PRD FR-API-01 AC3: the API's
  # OpenAPI document breaks no client of the main branch's.
  migrations:
    name: Migrations and generated code
    runs-on: ubuntu-latest
    env:
      # A pull request is compared with the main branch, and a push with
      # the commit it replaced.
      BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The checks compare with the main branch's history.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - name: Merged migrations are unchanged
        working-directory: server
        run: go run ./cmd/migrationcheck -base "$BASE"

      # Until the first release, a pull request may break the API if one of
      # its commits says why in an "API-Break: <reason>" trailer. Item 119
      # compares with the last release instead, and removes the override.
      # The check gates pull requests, and skips a push to main, which it
      # cannot stop: a squash merge rewrites a pull request's commits into
      # one whose message no longer ends with their trailers, so the check
      # would fail on main for a break that the pull request was allowed.
      - name: The API is compatible with the main branch
        if: github.event_name != 'push'
        working-directory: server
        run: go run ./cmd/apicompat -base "$BASE"

      - name: Generated SQL code is up to date
        working-directory: server/internal/database
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff

      - name: Extract the seed migrations
        id: seed
        shell: bash
        run: |
          fork="$(git merge-base HEAD "$BASE")"
          seed="$RUNNER_TEMP/seed-migrations"
          mkdir -p "$seed"
          if git cat-file -e "$fork:server/internal/database/migrations" 2>/dev/null; then
            git archive "$fork" server/internal/database/migrations | tar -x -C "$seed" --strip-components=4
          fi
          echo "The upgrade starts from $(find "$seed" -name '*.sql' | wc -l) migration(s) at $fork."
          echo "dir=$seed" >> "$GITHUB_OUTPUT"

      - name: Upgrade test
        working-directory: server
        env:
          STORYCREEP_TEST_UPGRADE_FROM: ${{ steps.seed.outputs.dir }}
        run: go test ./...

  # PRD FR-ADMIN-01 AC4 and FR-ADMIN-07 AC1–AC2: the container image, built
  # for both published platforms, and docker-compose.yml started with it, on
  # a runner of each platform.
  image:
    name: Container image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      # The default builder cannot build two platforms into one image. The
      # Dockerfile cross-compiles the binary, so neither needs emulation.
      - name: Set up the image builder
        run: docker buildx create --use --driver docker-container --name storycreep

      - name: Build the image for both platforms
        run: >-
          docker buildx build --file deploy/Dockerfile --platform linux/amd64,linux/arm64
          --build-arg STORYCREEP_COMMIT="$COMMIT"
          --build-arg STORYCREEP_COMMIT_TIME="$(git log -1 --format=%cI)"
          --output type=oci,dest="$RUNNER_TEMP/image.tar" .

      # From the builder's cache: the same image as the archive's.
      - name: Load the image of this runner's platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker buildx build --file deploy/Dockerfile --platform "$PLATFORM"
          --build-arg STORYCREEP_COMMIT="$COMMIT"
          --build-arg STORYCREEP_COMMIT_TIME="$(git log -1 --format=%cI)"
          --load --tag storycreep:test .

      - name: Image and compose tests
        working-directory: server
        env:
          STORYCREEP_TEST_IMAGE: storycreep:test
          STORYCREEP_TEST_IMAGE_ARCHIVE: ${{ runner.temp }}/image.tar
        run: go test -v ./internal/deploy

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # SECURITY.md: high and critical advisories are patched within 7 days,
      # so they fail the build. Lower severities do not.
      - name: pnpm audit
        run: pnpm audit --audit-level high

  # PRD FR-ADMIN-07 AC2: every run on the main branch publishes the image of
  # its commit for both platforms, once the checks have passed, as
  # ghcr.io/cybercute-studio/storycreep:sha-<commit>, and as :main unless
  # :main already has a newer commit. That is every run, not only a push's: a
  # scheduled or manual run that takes the place of a queued push's run
  # publishes its commit, and the weekly run rebuilds the image on its base
  # images' updates. A re-run of an older run leaves :main alone, because the
  # newer image may have migrated databases, which an older server refuses.
  # Release tags come with the release workflow (plan item 119). GitHub
  # creates the package as private, and a maintainer makes it public once
  # (CONTRIBUTING.md).
  publish:
    name: Publish the image
    if: github.ref == 'refs/heads/main'
    needs: [test, database, migrations, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Whether :main's commit is older than this one is read from the
          # main branch's history.
          fetch-depth: 0

      - name: Set up the image builder
        run: docker buildx create --use --driver docker-container --name storycreep

      - name: Log in to the GitHub container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:sha-$COMMIT")
          # The commit of :main's image, from its revision label, or nothing
          # before the first publish. :main moves to this commit unless it has
          # one that this commit does not descend from: a newer one, when an
          # older run is re-run. A commit missing from the history, as after
          # main was rewritten, does not hold it back.
          current="$(docker buildx imagetools inspect "$image:main" --format \
            '{{index (index .Image "linux/amd64").Config.Labels "org.opencontainers.image.revision"}}' \
            2>/dev/null || true)"
          if [ -n "$current" ] && git cat-file -e "$current^{commit}" 2>/dev/null &&
            ! git merge-base --is-ancestor "$current" "$COMMIT"; then
            echo "::notice::$image:main has the newer commit $current, so this run publishes only :sha-$COMMIT."
          else
            tags+=(--tag "$image:main")
          fi
          docker buildx build --file deploy/Dockerfile --platform linux/amd64,linux/arm64 \
            --build-arg STORYCREEP_COMMIT="$COMMIT" \
            --build-arg STORYCREEP_COMMIT_TIME="$(git log -1 --format=%cI)" \
            "${tags[@]}" --push .

      - name: Check the published platforms
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          published="$(docker buildx imagetools inspect --raw "$image:sha-$COMMIT" |
            jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' |
            sort | paste -sd ' ')"
          echo "Published $image:sha-$COMMIT for $published."
          if [ "$published" != "linux/amd64 linux/arm64" ]; then
            echo "The image should be published for linux/amd64 and linux/arm64."
            exit 1
          fi
