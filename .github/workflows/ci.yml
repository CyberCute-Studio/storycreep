name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that newly published advisories fail the dependency audit
  # without waiting for a code change.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its running checks. A run on main,
# including the scheduled audit, is never cancelled once it starts. Later runs
# queue behind it, and GitHub keeps only the newest queued run, which tests
# everything the cancelled ones would have.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # PRD §9.9: development is first-class on Windows ARM64 and macOS, so
        # the whole suite runs natively on all three.
        os: [ubuntu-latest, windows-11-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: server/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: JavaScript tests
        run: pnpm test

      - name: gofmt
        working-directory: server
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      - name: Go tests
        working-directory: server
        run: go test ./...

      - name: PRD and plan checks
        run: pnpm docs:check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: server/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: govulncheck
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # SECURITY.md: high and critical advisories are patched within 7 days,
      # so they fail the build. Lower severities do not.
      - name: pnpm audit
        run: pnpm audit --audit-level high
